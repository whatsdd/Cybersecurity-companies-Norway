notes:
  - security_staff is null when no in-house count has been established; null does not mean zero.
  - "whenever security_staff is set, security_staff_basis says what kind of claim it is: company-site (published by the company), attestation (vouched for first-hand), estimate (the maintainer's guarded estimate, the weakest basis) or crowd-platform (a researcher pool, not staff)."
  - "security_staff is never taken from Enhetsregisteret: brreg_employees is a whole-entity headcount and cannot be split into security and non-security staff."
  - "delivery says whether the Norwegian work is done by the company's own staff, mixed, or resold to a partner network; null or unknown means it was not established."
  - capabilities are the tags the company itself publishes, and specialty is a plain-language summary.
  - office_in_norway is false only when no Norwegian entity was found, not when staff are absent.
  - brreg_* fields come from Enhetsregisteret, the Norwegian register of legal entities.
